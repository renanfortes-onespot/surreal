<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Surreal · Painel de gestão</title>
<link rel="icon" href="../img/icone-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/seed.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/remote.js"></script>
<style>
/* ============================================================
   SURREAL — Painel de gestão (PC). OneSpot · 16/10/2026
   Clone da casca do portal do Checklist Atual (guia "casca nova"):
   VISÕES = leitura gerencial (hero + cards k4 + gráficos + tabelas mês/YTD)
   GESTÃO À VISTA = cadastros e lançamentos: tabela limpa ocupando a tela;
   clicar na linha abre a FICHA (modal largo, 2 colunas); "+ Novo" usa a mesma ficha.
   Acento = azul-marinho Surreal.
   ============================================================ */
:root{
  --fundo:#070B14; --side:#0E1628; --card:#121C33; --card-brd:#1E2B48; --linha:rgba(255,255,255,.06);
  --txt:#E9EEF7; --txt2:#9AA7BF; --txt3:#6B7891; --txt4:#4D5870; --hover:rgba(255,255,255,.05);
  --acc:#2563EB; --acc2:#5B9BFF; --verde:#3DD47A; --vermelho:#F4544A; --ambar:#F5A623; --cabec:#17223D; --pop:#111A2F;
  --inp:#0A1222; --onespot:#F18F2F;
}
body.claro{
  --fundo:#D7DEEA; --side:rgba(255,255,255,.62); --card:rgba(255,255,255,.80); --card-brd:rgba(20,45,100,.14); --linha:rgba(20,45,100,.10);
  --txt:#121A2E; --txt2:#4A5670; --txt3:#7A879E; --txt4:#A3AEC0; --hover:rgba(20,45,100,.06);
  --acc:#173A8C; --acc2:#2563EB; --verde:#14963F; --vermelho:#D7261B; --ambar:#C27C00; --cabec:#E3E9F3; --pop:#F6F8FC; --inp:#F1F4F9;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Montserrat',-apple-system,'Segoe UI',sans-serif;font-size:13px;color:var(--txt);background:var(--fundo);}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--txt3) 42%,transparent) transparent;}
button,input,select,textarea{font-family:inherit;}
.app{position:absolute;inset:14px;display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 28px 70px rgba(0,0,0,.5);}
body.claro .app{border-color:rgba(20,45,100,.12);box-shadow:0 28px 70px rgba(20,45,100,.18);}

/* ── lateral ── */
.side{width:248px;flex:0 0 248px;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--linha);padding:18px 10px 12px;overflow:auto;scrollbar-width:none;backdrop-filter:blur(12px);}
.side::-webkit-scrollbar{display:none;}
.s-logo{padding:2px 10px 10px;}
.s-logo img{display:block;width:150px;height:auto;}
.s-logo img.cla{display:none;} body.claro .s-logo img.esc{display:none;} body.claro .s-logo img.cla{display:block;}
.s-sec{padding:16px 10px 6px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1.1px;}
.s-item{display:flex;align-items:center;gap:11px;width:100%;padding:6px 10px;border:0;border-radius:8px;background:transparent;color:var(--txt2);font-size:12.5px;font-weight:500;text-align:left;cursor:pointer;text-decoration:none;}
.s-item:hover{background:var(--hover);color:var(--txt);}
.s-item.on{background:var(--hover);color:var(--txt);font-weight:700;}
.s-item svg{width:16px;height:16px;color:var(--acc2);flex:0 0 auto;}
body.claro .s-item svg{color:var(--acc);}
.s-item .n{margin-left:auto;font-size:10.5px;color:var(--txt3);font-weight:700;}
.s-item .n.al{color:var(--ambar);}
.s-pe{margin-top:auto;padding:12px 2px 0;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:6px;}
.s-user{display:flex;align-items:center;gap:9px;padding:2px 8px;}
.s-user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,var(--acc2),var(--acc));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.s-user b{display:block;font-size:12px;font-weight:700;}
.s-user i{display:flex;align-items:center;gap:5px;font-style:normal;font-size:9.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;margin-top:2px;}
.s-user .acts{margin-left:auto;display:flex;gap:2px;}
.s-user .acts button{background:transparent;border:0;color:var(--txt3);width:26px;height:26px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.s-user .acts button:hover{background:var(--hover);color:var(--txt);}
.s-user .acts svg{width:14px;height:14px;}
.s-user select{background:transparent;border:1px solid var(--card-brd);color:var(--txt);border-radius:7px;padding:4px 6px;font-size:11.5px;}
.s-por{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--txt3);font-weight:600;padding:2px 10px 0;}
.s-por b{color:var(--onespot);}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--verde);display:inline-block;} .sdot.s{background:var(--ambar);} .sdot.off{background:var(--vermelho);}

/* ── topo ── */
.board{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;gap:8px;padding:14px 24px 10px;flex-wrap:wrap;}
.top .tw{flex:1;min-width:200px;}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.3px;}
.top .sub{font-size:11px;color:var(--txt3);font-weight:600;margin-top:2px;}
.top .flt{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;}
.tlbl{display:flex;flex-direction:column;gap:3px;font-size:8.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;}
.tsel{background:var(--inp);border:1px solid var(--card-brd);border-radius:8px;padding:6px 9px;color:var(--txt);font-size:12px;font-weight:600;cursor:pointer;max-width:260px;}
.tsel:focus{outline:none;border-color:var(--acc2);}
.tsel option{background:var(--pop);color:var(--txt);}
.tema{width:22px;height:22px;border-radius:50%;border:2px solid var(--txt);background:linear-gradient(90deg,var(--txt) 50%,transparent 50%);cursor:pointer;margin-left:6px;align-self:center;}

/* ── visões ── */
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 24px 24px;overflow:auto;}
.card{border:1px solid var(--card-brd);border-radius:12px;background:var(--card);}
.hero{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;flex:0 0 auto;}
.hl{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.9px;}
.hv{font-size:clamp(30px,4.8vh,46px);font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-1px;}
.hd{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap;align-items:flex-end;}
.hd div{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;}
.hd b{display:block;font-size:14px;font-weight:800;color:var(--txt);margin-top:3px;letter-spacing:0;text-transform:none;}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:0 0 auto;min-height:clamp(108px,15vh,150px);}
.kpi{display:flex;flex-direction:column;border:1px solid var(--card-brd);border-radius:11px;background:var(--card);padding:14px 16px;min-width:0;}
.kpi .kl{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .kv{font-size:26px;font-weight:800;margin-top:6px;line-height:1.1;}
.kpi .kv.kvn{font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.kpi .km{font-size:10.5px;color:var(--txt3);margin-top:auto;padding-top:8px;font-weight:600;line-height:1.35;}
.cg{color:var(--verde)!important;font-weight:700;} .cr{color:var(--vermelho)!important;font-weight:700;} .amb{color:var(--ambar)!important;font-weight:700;} .mut{color:var(--txt3);} .muted{color:var(--txt4)!important;}
.gr2{flex:1 1 auto;min-height:230px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.gcard{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 16px 10px;}
.gtit{font-size:12px;font-weight:800;}
.gsub{font-size:10px;color:var(--txt3);margin:2px 0 6px;}
.gleg{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
.gleg span{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;color:var(--txt3);letter-spacing:.5px;}
.gleg i{width:14px;height:0;border-top:2px dashed currentColor;display:inline-block;}
.gleg i.sq{width:9px;height:9px;border:0;border-radius:2px;background:currentColor;}
.gcv{flex:1;min-height:0;position:relative;}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;flex:1 1 auto;min-height:0;}
.pilha{display:flex;flex-direction:column;gap:12px;min-height:0;}
.pilha > .gcard{flex:1 1 0;}
.dims{display:flex;gap:4px;flex-wrap:wrap;}
.dimb{background:transparent;border:1px solid var(--card-brd);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:10.5px;font-weight:700;color:var(--txt2);}
.dimb:hover{background:var(--hover);color:var(--txt);}
.dimb.on{background:var(--acc);border-color:transparent;color:#fff;}
.av2{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.45;color:var(--ambar);background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:10px;padding:8px 12px;flex:0 0 auto;}
.nota{font-size:10px;color:var(--txt3);line-height:1.5;margin-top:8px;flex:0 0 auto;}
.nota b{color:var(--txt2);}

/* ── tabelas (card .tsec ocupa a altura toda; a .twrap rola por dentro) ── */
.tsec{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;padding:14px 16px 12px;}
.thead-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.thead-row .dir{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ttit{font-size:14px;font-weight:800;}
.tsub{font-size:10px;color:var(--txt3);font-weight:600;}
.twrap{flex:1 1 auto;min-height:0;overflow:auto;border:1px solid var(--card-brd);border-radius:10px;background:var(--side);}
table.dre{width:100%;border-collapse:collapse;font-size:11.5px;}
table.dre thead th{position:sticky;top:0;z-index:2;background:var(--cabec);text-align:left;padding:10px 12px;font-size:9px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--card-brd);white-space:nowrap;cursor:pointer;user-select:none;}
table.dre thead th .ytd{color:var(--acc2);margin-right:4px;}
table.dre th.num,table.dre td.num{text-align:right;}
table.dre th.c,table.dre td.c{text-align:center;}
table.dre td{padding:9px 12px;border-bottom:1px solid var(--linha);color:var(--txt2);white-space:nowrap;font-variant-numeric:tabular-nums;}
table.dre td.conta{color:var(--txt);font-weight:600;white-space:normal;}
table.dre tbody tr:hover{background:var(--hover);}
table.dre tbody tr.lk{cursor:pointer;}
table.dre tr.total td{font-weight:800;color:var(--txt);background:var(--cabec);border-top:1px solid var(--card-brd);position:sticky;bottom:0;}
table.dre .sep-l{border-left:1px solid var(--card-brd);}
table.dre th .ar{opacity:.6;margin-left:4px;color:var(--acc2);}
body.claro .twrap{background:rgba(255,255,255,.45);}
body.claro table.dre tbody tr:nth-child(even) td{background:rgba(15,23,42,.025);}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;}
.st::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
.st.vd{color:var(--verde);} .st.am{color:var(--ambar);} .st.vm{color:var(--vermelho);} .st.az{color:var(--acc2);} .st.cz{color:var(--txt3);}
.cl{display:block;max-width:380px;overflow:hidden;text-overflow:ellipsis;}
.busca{display:flex;align-items:center;gap:7px;border:1px solid var(--card-brd);border-radius:7px;padding:4px 9px;color:var(--txt3);}
.busca input{background:transparent;border:0;outline:0;font-size:11.5px;color:var(--txt);width:170px;}
.busca svg{width:12px;height:12px;}

/* ── botões e campos ── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--card-brd);border-radius:8px;padding:7px 13px;font-size:11.5px;font-weight:700;color:var(--txt2);background:transparent;cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--hover);color:var(--txt);}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff;}
.btn.pri:hover{filter:brightness(1.12);}
.btn.warn{color:var(--vermelho);}
.btn.sm{padding:4px 9px;font-size:10.5px;}
.btn svg{width:13px;height:13px;}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0;}
.fld label{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;}
.fld label .ctx{text-transform:none;letter-spacing:0;font-weight:500;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.frow.f3{grid-template-columns:repeat(3,1fr);} .frow.f4{grid-template-columns:repeat(4,1fr);}
.inp{background:var(--inp);border:1px solid var(--card-brd);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--txt);outline:0;width:100%;}
.inp:focus{border-color:var(--acc2);}
body.claro .inp{border-color:rgba(15,23,42,.2);}
.inp.num{text-align:right;font-variant-numeric:tabular-nums;}
.inp.sm{padding:4px 7px;font-size:11.5px;}
select.inp option{background:var(--pop);color:var(--txt);}
textarea.inp{min-height:64px;resize:vertical;}
.seg{display:inline-flex;align-self:flex-start;gap:2px;padding:3px;border:1px solid var(--card-brd);border-radius:9px;background:var(--inp);}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--txt2);cursor:pointer;}
.seg button.on{background:var(--acc);color:#fff;}
.erro{color:var(--vermelho);font-size:11px;font-weight:600;min-height:14px;margin-top:4px;}
.ctx{color:var(--txt3);font-weight:500;}
input[type=range]{accent-color:var(--acc2);}

/* ── modal / ficha ── */
.ov{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.5);display:none;}
.ov.on{display:block;}
.modal{position:fixed;inset:0;z-index:820;display:none;align-items:center;justify-content:center;padding:16px;}
.modal.on{display:flex;}
.m-card{background:var(--pop);border:1px solid var(--card-brd);border-radius:14px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);color:var(--txt);}
.m-card.wiz{width:min(1020px,100%);height:min(88vh,760px);}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--linha);flex:0 0 auto;}
.m-head h2{font-size:15px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-body{padding:16px 20px;flex:1 1 auto;min-height:0;overflow:auto;}
.m-card.wiz .m-body{display:flex;flex-direction:column;overflow:hidden;}
.m-foot{padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;border-top:1px solid var(--linha);flex:0 0 auto;}
.m-foot .esq{margin-right:auto;font-size:11.5px;font-weight:700;color:var(--txt2);}
.x-btn{background:transparent;border:0;color:var(--txt3);cursor:pointer;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.x-btn:hover{background:var(--hover);color:var(--txt);}
.x-btn svg{width:16px;height:16px;}
.wz-2col{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;}
.wz-col{display:flex;flex-direction:column;min-height:0;border:1px solid var(--card-brd);border-radius:10px;background:var(--side);overflow:hidden;}
.wz-ch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--card-brd);background:var(--cabec);flex:0 0 auto;}
.wz-ch b{font-size:12.5px;font-weight:800;}
.wz-ch small{display:block;font-size:10px;color:var(--txt3);font-weight:600;margin-top:1px;}
.wz-ch .dir{margin-left:auto;display:flex;gap:6px;align-items:center;}
.wz-in{flex:1;min-height:0;overflow:auto;padding:14px 14px 6px;}
.wz-pe{flex:0 0 auto;border-top:1px solid var(--card-brd);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.mk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.mk div{border:1px solid var(--card-brd);border-radius:9px;padding:8px 10px;min-width:0;}
.mk small{display:block;font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;}
.mk b{display:block;font-size:15px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lin{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--linha);font-size:12px;}
.lin .nm{flex:1;min-width:0;}
.lin .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lin .nm small{display:block;font-size:10.5px;color:var(--txt3);}
.lin .v{font-weight:700;white-space:nowrap;text-align:right;}
.sec2{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;padding:12px 2px 4px;}
.step{display:inline-flex;align-items:center;border:1px solid var(--card-brd);border-radius:7px;}
.step button{width:24px;height:26px;border:0;background:none;color:var(--txt);font-size:15px;cursor:pointer;}
.step span{min-width:22px;text-align:center;font-weight:700;}
.tams{display:flex;gap:5px;flex-wrap:wrap;}
.tams button{border:1px solid var(--card-brd);background:var(--inp);color:var(--txt);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;line-height:1.2;}
.tams button small{display:block;font-size:9.5px;color:var(--txt3);font-weight:600;}
.tams button.tem{border-color:var(--acc2);}
.pg{display:grid;grid-template-columns:110px repeat(4,minmax(0,1fr));gap:6px;align-items:center;font-size:11.5px;}
.pg .h{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;text-align:right;}
.pg .cn{font-weight:700;}
.pg .cel small{display:block;font-size:9.5px;text-align:right;margin-top:2px;font-weight:700;}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--fundo);font-size:12.5px;font-weight:700;border-radius:999px;padding:10px 18px;opacity:0;transition:all .25s;z-index:900;pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%);}

/* login */
#login{position:fixed;inset:0;z-index:95;background:var(--fundo);display:none;align-items:center;justify-content:center;}
#login.on{display:flex;}
.lg-box{width:380px;max-width:92vw;border:1px solid var(--card-brd);border-radius:16px;background:var(--card);padding:30px 28px;box-shadow:0 28px 70px rgba(0,0,0,.35);}
.lg-box img{display:block;width:230px;margin:0 auto 18px;} .lg-box img.cla{display:none;} body.claro .lg-box img.esc{display:none;} body.claro .lg-box img.cla{display:block;}
.lg-box .btn.pri{width:100%;justify-content:center;padding:11px;font-size:13px;}
.lg-erro{color:var(--vermelho);font-size:12px;font-weight:600;text-align:center;min-height:18px;margin:4px 0 8px;}

@media(max-width:1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media(max-width:860px){

    + '<div class="frow"><div class="fld"><label>Tipo</label>'+segH('inTipo',[['ingrediente','Ingrediente (kg)'],['embalagem','Embalagem (un)']],IF.tipo,'inTipoSet')+'</div><div class="fld"><label>Categoria</label><input class="inp" id="inCat" list="dlCat" value="'+esc(i?i.cat:'')+'"><datalist id="dlCat">'+Object.keys(cats).map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></div></div>'

  var hist=i?D().compras.filter(function(c){return c.insumo===i.id;}).sort(function(a,b){return a.data<b.data?1:-1;}).map(function(c){ return '<div class="lin"><div class="nm"><b>'+SG.dataBR(c.data)+'</b><small>'+SG.qtdFmt(c.qtd,i.un)+' por '+SG.brl(c.valor)+'</small></div><div class="v">'+SG.brl(c.valor/c.qtd)+'/'+(i.un==='un'?'un':'kg')+'</div></div>'; }).join(''):'';
  var rec=i?D().receitas.filter(function(r){return r.itens.some(function(x){return x.insumo===i.id;});}).map(function(r){ var g=r.itens.filter(function(x){return x.insumo===i.id;})[0].g; return '<div class="lin"><div class="nm"><b>'+esc(r.nome)+'</b></div><div class="v">'+SG.num(g,1)+' g/kg</div></div>'; }).join(''):'';

    footPad("salvaInsumo("+(i?"'"+i.id+"'":'null')+")", i?"apagaInsumo('"+i.id+"')":null), true);

function inTipoSet(t){ window.IF.tipo=t; }
function salvaInsumo(id){ var n=($('inNome').value||'').trim(); if(!n){ $('inErro').textContent='Informe o nome.'; return; }
  var o={nome:n, tipo:window.IF.tipo, un:window.IF.tipo==='embalagem'?'un':'kg', cat:($('inCat').value||'Outros').trim(), custoManual:numIn($('inCusto').value)||0, min:numIn($('inMin').value)||0, estimado:false};

var PP=null;
function abrirProduto(id){
  var p=id?SG.produto(id):null;
  PP={id:id, nome:p?p.nome:'', receita:p?p.receita:null, cobertura:p?p.cobertura:null, pctCob:p?(+p.pctCob||0):0.1, ativo:p?p.ativo!==false:true, precos:JSON.parse(JSON.stringify((p&&D().precos[p.id])||{}))};
  var rs=D().receitas.filter(function(r){return r.tipo==='sabor';}), cs=D().receitas.filter(function(r){return r.tipo==='cobertura';});
  var dados='<div class="fld"><label>Nome no cardápio</label><input class="inp" id="ppNome" value="'+esc(PP.nome)+'" placeholder="Ex.: Pistache com Calda de Chocolate"></div>'
    + '<div class="fld"><label>Receita base</label><select class="inp" id="ppRec" onchange="PP.receita=this.value||null;ppPrecos()"><option value="">— sem ficha técnica —</option>'+rs.map(function(r){return '<option value="'+r.id+'"'+(r.id===PP.receita?' selected':'')+'>'+esc(r.nome)+'</option>';}).join('')+'</select></div>'
    + '<div class="frow"><div class="fld"><label>Cobertura / calda</label><select class="inp" id="ppCob" onchange="PP.cobertura=this.value||null;ppPrecos()"><option value="">— nenhuma —</option>'+cs.map(function(r){return '<option value="'+r.id+'"'+(r.id===PP.cobertura?' selected':'')+'>'+esc(r.nome)+'</option>';}).join('')+'</select></div><div class="fld"><label>% do pote que é cobertura</label><input class="inp num" id="ppPct" value="'+nv(PP.pctCob*100,0)+'" oninput="PP.pctCob=(numIn(this.value)||0)/100;ppPrecos()"></div></div>'
    + '<div class="fld"><label>Situação</label>'+segH('ppAt',[['1','No cardápio'],['0','Inativo']],PP.ativo?'1':'0','ppAtivo')+'</div><div class="erro" id="ppErro"></div>';
  abrirModal(p?'Produto · '+p.nome:'Novo produto', '<div class="wz-2col">'+col('Produto','o que é vendido',dados)+col('Preços','por canal e tamanho · embaixo do preço, margem real e custo','<div id="ppPre"></div>')+'</div>',
    footPad('salvaProduto()', p?"apagaProduto('"+p.id+"')":null), true);
  ppPrecos();
}
function ppAtivo(v){ PP.ativo=v==='1'; }
function ppPrecos(){
  var tmp={id:'__pp', nome:'tmp', receita:PP.receita, cobertura:PP.cobertura, pctCob:PP.pctCob}; D().produtos.push(tmp); var old=D().precos.__pp; D().precos.__pp=PP.precos;
  var ts=D().tamanhos, h='';
  D().canais.forEach(function(c){
    h+='<div class="sec2">'+esc(c.nome)+(c.taxa?' · taxa '+SG.pct(c.taxa,0):'')+'</div><div class="pg"><div></div>'+ts.map(function(t){return '<div class="h">'+t.nome+' · '+t.ml+(t.ativo?'':' (sim.)')+'</div>';}).join('')+'<div class="cn">Preço (R$)</div>'
      + ts.map(function(t){ var x=SG.precificar('__pp',t.id,c.id), pr=(PP.precos[c.id]||{})[t.id];
        return '<div class="cel"><input class="inp num sm" value="'+(pr!=null?nv(pr):'')+'" placeholder="'+nv(Math.ceil(x.sugerido||0),0)+'" onchange="ppSet(\''+c.id+'\',\''+t.id+'\',this.value)"><small class="'+(pr!=null&&!x.custo.semFicha?corMg(x.margem):'mut')+'">'+(pr!=null&&!x.custo.semFicha?SG.pct(x.margem,0)+' · lucro '+SG.brl(x.lucro):'custo '+SG.brl(x.custo.total))+'</small></div>'; }).join('')+'</div>';
  });
  D().produtos.pop(); if(old===undefined) delete D().precos.__pp; else D().precos.__pp=old;
  $('ppPre').innerHTML=h+'<div class="nota">Em branco = sem preço de tabela (no pedido entra o sugerido para a meta de '+SG.pct(D().config.margemAlvo,0)+', que aparece apagado no campo).</div>';
}
function ppSet(c,t,v){ PP.precos[c]=PP.precos[c]||{}; var n=numIn(v); if(n==null) delete PP.precos[c][t]; else PP.precos[c][t]=n; ppPrecos(); }
function salvaProduto(){ var n=($('ppNome').value||'').trim(); if(!n){ $('ppErro').textContent='Informe o nome.'; return; }
  var o={nome:n, receita:PP.receita, cobertura:PP.cobertura, pctCob:PP.pctCob, ativo:PP.ativo}, id=PP.id;
  if(id) Object.assign(SG.produto(id),o); else { id=SG.novoId('pr'); D().produtos.push(Object.assign({id:id},o)); }
  D().precos[id]=PP.precos; SG.salvar(true); fecharModal(); toast('Produto salvo'); }
function apagaProduto(id){ if(D().vendas.some(function(v){return v.itens.some(function(i){return i.produto===id;});})){ alert('Este produto já tem pedidos. Marque como Inativo em vez de excluir.'); return; } if(apagaReg('produtos',id,'Excluir este produto?')){ delete D().precos[id]; SG.salvar(true); } }

  var agg={}; D().vendas.forEach(function(v){ if(!v.cliente) return; var a=agg[v.cliente]=agg[v.cliente]||{n:0,t:0,p:0,u:null}; a.n++; a.t+=SG.totalVenda(v); a.p+=SG.potesVenda(v); if(!a.u||v.data>a.u) a.u=v.data; });
  var hj=new Date(SG.hoje()), dias=function(d){ return d?Math.round((hj-new Date(d))/864e5):null; }, g=function(c){return agg[c.id]||{n:0,t:0,p:0,u:null};};
  var ls=D().clientes.filter(function(c){return qOk('cli',[c.nome,c.fone]);});
  if(!ORD.tCli) ORD.tCli={i:5,d:-1};
  $('view').innerHTML=cadastro(D().clientes.length+' clientes · '+D().clientes.filter(function(c){return c.tipo==='revenda';}).length+' revendas · clique no cliente para ver e editar', busca('cli','Nome ou telefone…'), btNovo('Novo cliente','abrirCliente(null)'),

      {t:'Cliente',f:function(c){return esc(c.nome);},s:function(c){return c.nome;},cls:'conta'},
      {t:'Tipo',f:function(c){return c.tipo==='revenda'?'Revenda':'Consumidor';},s:function(c){return c.tipo;}},
      {t:'Telefone',f:function(c){return esc(c.fone||'—');}},
      {t:'Pedidos',f:function(c){return g(c).n;},v:function(c){return g(c).n;},cls:'num'},
      {t:'Potes',f:function(c){return g(c).p;},v:function(c){return g(c).p;},cls:'num'},
      {t:'Faturamento',f:function(c){return '<b style="color:var(--txt)">'+SG.brl(g(c).t)+'</b>';},v:function(c){return g(c).t;},cls:'num'},
      {t:'Ticket médio',f:function(c){return g(c).n?SG.brl(g(c).t/g(c).n):'—';},v:function(c){return g(c).n?g(c).t/g(c).n:0;},cls:'num'},
      {t:'Último pedido',f:function(c){var u=g(c).u,d=dias(u);return u?SG.dataBR(u)+' <span class="'+(d>30?'amb':'mut')+'">· há '+d+' d</span>':'—';},s:function(c){return g(c).u||'';}},
    ], ls, null, function(c){ return "abrirCliente('"+c.id+"')"; }));
};

    footPad("salvaCliente("+(c?"'"+c.id+"'":'null')+")", c&&!vs.length?"apagaReg('clientes','"+c.id+"','Excluir este cliente?')":null), true);

function backup(){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(D(),null,1)],{type:'application/json'})); a.download='surreal-backup-'+SG.hoje()+'.json'; a.click(); }
function restaura(f){ if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d.versao||!d.receitas) throw 0; if(!confirm('Substituir os dados atuais pelo backup?')) return; if(SGR.ativo){ SG.usar(d); SG.salvar(); toast('Backup restaurado e enviado'); } else { localStorage.setItem('sg_dados',JSON.stringify(d)); location.reload(); } }catch(e){ alert('Arquivo inválido'); } }; r.readAsText(f); }

/* baixar o app: QR para o celular */
function baixarApp(){
  var url='https://surreal.onespot.com.br/', qr='';
  try{ var q=qrcode(0,'M'); q.addData(url); q.make(); qr=q.createSvgTag({cellSize:6,margin:2,scalable:true}); }catch(e){}
  abrirModal('Baixar o app no celular','<div style="text-align:center"><div class="tsub" style="margin-bottom:12px">Aponte a câmera do celular para o código</div><div style="width:220px;margin:0 auto 14px;background:#fff;border-radius:12px;padding:10px">'+qr+'</div>'
    + '<div class="nota" style="text-align:left;line-height:1.8;font-size:11.5px"><b>Android (Chrome):</b> abra o link → ⋮ → <b>Instalar app</b>.<br><b>iPhone (Safari):</b> abra o link → Compartilhar → <b>Adicionar à Tela de Início</b>.<br>Ou digite: <b>surreal.onespot.com.br</b></div></div>', '<button class="btn pri" onclick="fecharModal()">Fechar</button>');
}

/* login (modo remoto) */
function mostraLogin(msg){ $('login').classList.add('on'); $('lgForm').style.display=''; $('lgCarr').style.display='none'; $('lgErro').textContent=msg||''; $('btEntrar').disabled=false; $('btEntrar').textContent='Entrar'; }
function entrar(){ var e=$('lgEmail').value, s=$('lgSenha').value; if(!e||!s){ $('lgErro').textContent='Preencha e-mail e senha.'; return; }
  $('btEntrar').disabled=true; $('btEntrar').textContent='Entrando…'; $('lgErro').textContent='';
  SGR.entrar(e,s,CB).catch(function(x){ $('btEntrar').disabled=false; $('btEntrar').textContent='Entrar'; if(x.message) $('lgErro').textContent=x.message; }); }
function trocaSenha(){ var n=prompt('Nova senha (mínimo 6 caracteres):'); if(!n) return; if(n.length<6){ alert('A senha precisa ter pelo menos 6 caracteres.'); return; } SGR.trocarSenha(n).then(function(){ toast('Senha trocada'); }).catch(function(e){ alert('Não deu: '+e.message); }); }
var CB={ login:mostraLogin, pronto:function(){ $('login').classList.remove('on'); render(); },
  status:function(s){ var d=$('sdot'); if(d) d.className='sdot'+(s==='sync'?' s':s==='off'?' off':''); } };
window.addEventListener('resize', function(){ clearTimeout(window._rz); window._rz=setTimeout(function(){ if(!$('modal').classList.contains('on')) render(); },200); });
aplicaTema();
if(!SGR.ativo) render(); else { $('login').classList.add('on'); $('lgForm').style.display='none'; $('lgCarr').style.display=''; SGR.iniciar(CB); }
</script>
