<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Surreal · Painel de gestão</title>
<link rel="icon" href="../img/icone-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/seed.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/remote.js"></script>
<style>
/* ============================================================
   SURREAL — Painel de gestão (PC). OneSpot · 16/10/2026
   Casca do portal do Checklist Atual: moldura flutuante, lateral com
   seções, hero + KPIs + gráficos, tabelas com cabeçalho fixo.
   Acento = azul-marinho Surreal (lavanda no escuro).
   ============================================================ */
:root{
  --fundo:#070B14; --side:#0E1628; --card:#121C33; --card-brd:#1E2B48; --linha:rgba(255,255,255,.06);
  --txt:#E9EEF7; --txt2:#9AA7BF; --txt3:#6B7891; --hover:rgba(255,255,255,.05);
  --acc:#2563EB; --acc2:#5B9BFF; --verde:#3DD47A; --vermelho:#F4544A; --ambar:#F5A623; --cabec:#17223D; --pop:#121C33;
  --inp:#0A1222; --onespot:#F18F2F;
}
body.claro{
  --fundo:#D7DEEA; --side:rgba(255,255,255,.62); --card:rgba(255,255,255,.80); --card-brd:rgba(20,45,100,.14); --linha:rgba(20,45,100,.10);
  --txt:#121A2E; --txt2:#4A5670; --txt3:#7A879E; --hover:rgba(20,45,100,.06);
  --acc:#173A8C; --acc2:#2563EB; --verde:#14963F; --vermelho:#D7261B; --ambar:#C27C00; --cabec:#E3E9F3; --pop:#F6F8FC; --inp:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Montserrat',-apple-system,'Segoe UI',sans-serif;font-size:13px;color:var(--txt);background:var(--fundo);}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--txt3) 42%,transparent) transparent;}
button,input,select,textarea{font-family:inherit;}
.app{position:absolute;inset:14px;display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 28px 70px rgba(0,0,0,.5);}
body.claro .app{border-color:rgba(20,45,100,.12);box-shadow:0 28px 70px rgba(20,45,100,.18);}

/* lateral */
.side{width:248px;flex:0 0 248px;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--linha);padding:18px 10px 12px;overflow:auto;scrollbar-width:none;backdrop-filter:blur(12px);}
.side::-webkit-scrollbar{display:none;}
.s-logo{padding:2px 10px 14px;}
.s-logo img{display:block;width:150px;height:auto;}
.s-logo img.cla{display:none;} body.claro .s-logo img.esc{display:none;} body.claro .s-logo img.cla{display:block;}
.s-sec{padding:14px 10px 6px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1.1px;}
.s-item{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:transparent;color:var(--txt2);font-size:12.5px;font-weight:500;text-align:left;cursor:pointer;}
.s-item:hover{background:var(--hover);color:var(--txt);}
.s-item.on{background:var(--hover);color:var(--txt);font-weight:700;}
.s-item svg{width:16px;height:16px;color:var(--acc2);flex:0 0 auto;}
body.claro .s-item svg{color:var(--acc);}
.s-item .n{margin-left:auto;font-size:10.5px;color:var(--txt3);font-weight:700;}
.s-item .n.al{color:var(--ambar);}
.s-pe{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:8px;}
.s-pe select{background:transparent;border:1px solid var(--card-brd);color:var(--txt);border-radius:7px;padding:6px 8px;font-size:12px;}
.s-pe select option{background:var(--pop);}
.s-por{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--txt3);font-weight:600;}
.s-por b{color:var(--onespot);}

/* conteúdo */
.board{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;gap:10px;padding:16px 26px 12px;flex-wrap:wrap;}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.3px;}
.top .sub{font-size:11px;color:var(--txt3);font-weight:600;margin-top:2px;}
.top .tw{flex:1;min-width:0;}
.tool{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--card-brd);border-radius:8px;padding:7px 12px;color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;}
.tool:hover{background:var(--hover);color:var(--txt);}
.tool.pri{background:var(--acc);border-color:var(--acc);color:#fff;}
.tool svg{width:15px;height:15px;}
.tema{width:22px;height:22px;border-radius:50%;border:2px solid var(--txt);background:linear-gradient(90deg,var(--txt) 50%,transparent 50%);cursor:pointer;margin-left:4px;}
.view{flex:1;min-height:0;overflow:auto;padding:0 26px 26px;display:flex;flex-direction:column;gap:14px;}
.card{border:1px solid var(--card-brd);border-radius:12px;background:var(--card);padding:16px 18px;}
.ct{font-size:13px;font-weight:800;}
.cs{font-size:10.5px;color:var(--txt3);margin:2px 0 10px;font-weight:500;}
.row{display:flex;gap:14px;align-items:stretch;}
.row > *{flex:1;min-width:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;}

.hero{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:4px 0 2px;}
.hl{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.9px;}
.hv{font-size:44px;font-weight:800;line-height:1;margin-top:6px;letter-spacing:-1px;}
.hd{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap;}
.hd div{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;}
.hd b{display:block;font-size:15px;font-weight:800;color:var(--txt);margin-top:3px;letter-spacing:0;text-transform:none;}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;}
.kpi{border:1px solid var(--card-brd);border-radius:11px;background:var(--card);padding:14px 16px;}
.kpi .kl{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;}
.kpi .kv{font-size:23px;font-weight:800;margin-top:7px;line-height:1.1;}
.kpi .km{font-size:10.5px;color:var(--txt3);margin-top:7px;font-weight:600;}
.pos{color:var(--verde);} .neg{color:var(--vermelho);} .amb{color:var(--ambar);} .mut{color:var(--txt3);}
.gbox{position:relative;height:250px;}

/* tabelas */
.twrap{overflow:auto;border:1px solid var(--card-brd);border-radius:10px;background:var(--card);}
.twrap.alta{max-height:calc(100vh - 230px);}
table.t{width:100%;border-collapse:collapse;font-size:11.5px;}
table.t th{position:sticky;top:0;z-index:2;background:var(--cabec);text-align:left;padding:9px 11px;font-size:9px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--card-brd);white-space:nowrap;cursor:pointer;user-select:none;}
table.t th.num,table.t td.num{text-align:right;}
table.t th.c,table.t td.c{text-align:center;}
table.t td{padding:8px 11px;border-bottom:1px solid var(--linha);color:var(--txt2);white-space:nowrap;font-variant-numeric:tabular-nums;}
table.t td.nm{color:var(--txt);font-weight:600;white-space:normal;min-width:180px;}
table.t tbody tr:hover{background:var(--hover);}
table.t tr.tot td{font-weight:800;color:var(--txt);background:var(--cabec);border-top:1px solid var(--card-brd);}
table.t th .ar{opacity:.5;margin-left:4px;}
table.t input,table.t select{background:var(--inp);border:1px solid var(--card-brd);border-radius:6px;padding:5px 7px;color:var(--txt);font-size:11.5px;font-weight:600;width:84px;text-align:right;}
table.t input.w{width:100%;text-align:left;min-width:160px;}
table.t select{width:auto;text-align:left;}
table.t input:focus,table.t select:focus{outline:none;border-color:var(--acc2);}
.tag{display:inline-block;font-size:9.5px;font-weight:700;border-radius:5px;padding:2px 7px;background:var(--hover);color:var(--txt2);}
.tag.vd{background:rgba(61,212,122,.14);color:var(--verde);} .tag.am{background:rgba(245,166,35,.15);color:var(--ambar);} .tag.vm{background:rgba(244,84,74,.14);color:var(--vermelho);} .tag.ac{background:color-mix(in srgb,var(--acc2) 18%,transparent);color:var(--acc2);}
body.claro .tag.ac{color:var(--acc);}
.chk{cursor:pointer;}
.del{background:none;border:0;color:var(--txt3);cursor:pointer;font-size:15px;padding:0 4px;}
.del:hover{color:var(--vermelho);}

/* matriz de preços */
.mx td.cel{padding:6px 8px;}
.mx .cell{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.mx .cell input{width:74px;}
.mx .cell small{font-size:9.5px;font-weight:700;}
.mx .cell .cu{font-size:9.5px;color:var(--txt3);font-weight:600;}

/* formulários */
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.f{display:flex;flex-direction:column;gap:5px;}
.f label{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;}
.f input,.f select,.f textarea{background:var(--inp);border:1px solid var(--card-brd);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:12.5px;font-weight:600;min-width:120px;}
.f input:focus,.f select:focus{outline:none;border-color:var(--acc2);}
.segs{display:inline-flex;border:1px solid var(--card-brd);border-radius:9px;padding:3px;gap:3px;background:var(--inp);}
.segs button{border:0;background:none;color:var(--txt2);font-size:11.5px;font-weight:700;border-radius:7px;padding:6px 12px;cursor:pointer;}
.segs button.on{background:var(--acc);color:#fff;}
input[type=range]{accent-color:var(--acc2);}
.av2{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.45;color:var(--ambar);background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:10px;padding:10px 12px;}
.nota{font-size:11px;color:var(--txt3);line-height:1.55;}
.nota b{color:var(--txt2);}
.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;}
.bars .r span{flex:0 0 140px;color:var(--txt2);}
.bars .r .bb{flex:1;height:9px;border-radius:5px;background:var(--hover);overflow:hidden;}
.bars .r .bb i{display:block;height:100%;background:var(--acc2);border-radius:5px;}
.bars .r b{flex:0 0 74px;text-align:right;}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1;}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.mini3 div{border:1px solid var(--card-brd);border-radius:10px;padding:10px 12px;}
.mini3 span{display:block;font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;}
.mini3 b{display:block;font-size:17px;font-weight:800;margin-top:4px;}
.lista-r{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 220px);overflow:auto;}
.lista-r button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--txt2);cursor:pointer;font-size:12px;font-weight:600;}
.lista-r button:hover{background:var(--hover);}
.lista-r button.on{background:var(--hover);color:var(--txt);}
.lista-r .g{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;padding:10px 10px 4px;}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--fundo);font-size:12.5px;font-weight:700;border-radius:999px;padding:10px 18px;opacity:0;transition:all .25s;z-index:90;pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%);}
#login{position:fixed;inset:0;z-index:95;background:var(--fundo);display:none;align-items:center;justify-content:center;}
#login.on{display:flex;}
.lg-box{width:380px;max-width:92vw;border:1px solid var(--card-brd);border-radius:16px;background:var(--card);padding:30px 28px;box-shadow:0 28px 70px rgba(0,0,0,.35);}
.lg-box img{display:block;width:230px;margin:0 auto 18px;} .lg-box img.cla{display:none;} body.claro .lg-box img.esc{display:none;} body.claro .lg-box img.cla{display:block;}
.lg-box .f{margin-bottom:12px;} .lg-box .f input{width:100%;}
.lg-box .tool.pri{width:100%;justify-content:center;padding:11px;font-size:13px;}
.lg-erro{color:var(--vermelho);font-size:12px;font-weight:600;text-align:center;min-height:18px;margin:4px 0 8px;}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--verde);display:inline-block;flex:0 0 8px;} .sdot.s{background:var(--ambar);} .sdot.off{background:var(--vermelho);}
@media(max-width:1100px){ .kpis{grid-template-columns:repeat(3,1fr);} .grid3{grid-template-columns:1fr;} }
@media(max-width:860px){ .app{inset:0;border-radius:0;flex-direction:column;} .side{width:auto;flex:0 0 auto;flex-direction:row;overflow-x:auto;padding:8px;} .s-sec,.s-pe,.s-logo{display:none;} .s-item{white-space:nowrap;width:auto;} .grid2{grid-template-columns:1fr;} .row{flex-direction:column;} }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="board">
    <div class="top"><div class="tw"><h1 id="tit"></h1><div class="sub" id="tsub"></div></div><div id="tacts" style="display:flex;gap:8px;align-items:center"></div><div class="tema" onclick="alternaTema()" title="Tema claro/escuro"></div></div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="login"><div class="lg-box">
  <img class="esc" src="../img/logo-arabesco-branco.png" alt="Surreal"><img class="cla" src="../img/logo-arabesco-navy.png" alt="Surreal">
  <div id="lgForm"><div class="f"><label>E-mail</label><input id="lgEmail" type="email" autocomplete="username"></div>
  <div class="f"><label>Senha</label><input id="lgSenha" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()"></div>
  <div class="lg-erro" id="lgErro"></div><button class="tool pri" id="btEntrar" onclick="entrar()">Entrar</button></div>
  <div class="nota" id="lgCarr" style="display:none;text-align:center">Carregando os dados…</div>
</div></div>
<script>
if(!SGR.ativo && !window.SG_SEED){ document.addEventListener('DOMContentLoaded',function(){ document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:Montserrat,sans-serif;color:#9AA7BF">Surreal · painel em configuração.</div>'; }); throw new Error('sem configuração'); }
if(!SGR.ativo) SG.carregar();
var D=function(){return SG.D;}, $=function(id){return document.getElementById(id);};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function numIn(v){ if(v==null||v==='') return null; v=String(v).trim().replace(/^R\$\s*/,''); if(v.indexOf(',')>=0) v=v.replace(/\./g,'').replace(',','.'); var n=parseFloat(v); return isNaN(n)?null:n; }
function nv(v,c){ return v==null?'':String(+(+v).toFixed(c==null?2:c)).replace('.',','); }
function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){e.classList.remove('on');},2200); }
var I={
  resumo:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', preco:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  sim:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h0M16 12h0M8 16h2M12 16h0M16 16h0"/>',
  ficha:'<path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 001.3 2h11.4A1.5 1.5 0 0019 19l-5-10V3"/><path d="M7.5 14h9"/>',
  insumo:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  compra:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2l2.5 11h11L21 7H7"/>',
  prod:'<path d="M5 9h14l-1.5 10a2 2 0 01-2 1.7h-7a2 2 0 01-2-1.7z"/><path d="M4 9h16M8 9a4 4 0 018 0"/>',
  estoque:'<path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/>',
  vendas:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
  clientes:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 4.8a3 3 0 010 6M18 14.8c1.8.7 3 2.5 3 5.2"/>',
  fin:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5V8M12 16v1.5"/>',
  config:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  celular:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>', mais:'<path d="M12 5v14M5 12h14"/>', baixar:'<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>',
};
function ic(n){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+I[n]+'</svg>'; }
function aplicaTema(){ var c=false; try{c=localStorage.getItem('sg_tema')==='claro';}catch(e){} document.body.classList.toggle('claro',c); }
function alternaTema(){ var c=!document.body.classList.contains('claro'); try{localStorage.setItem('sg_tema',c?'claro':'escuro');}catch(e){} aplicaTema(); render(); }
function cor(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function nCanal(c){ var x=SG.canal(c); return x?x.nome:c; }

/* ── navegação ── */
var MENU=[
  ['Visão geral',[['resumo','Resumo','resumo']]],
  ['Preço',[['precos','Tabela de preços','preco'],['simulador','Simulador e cenários','sim']]],
  ['Produção',[['fichas','Fichas técnicas','ficha'],['insumos','Insumos','insumo'],['producao','Produção','prod'],['estoque','Estoque','estoque']]],
  ['Comercial',[['vendas','Pedidos','vendas'],['clientes','Clientes','clientes']]],
  ['Financeiro',[['financeiro','Resultado e caixa','fin'],['compras','Compras e despesas','compra']]],
  ['Ajustes',[['config','Configurações','config']]],
];
var V={view:'resumo', ym:SG.mesAtual()};
try{ var _v=localStorage.getItem('sg_view'); if(_v) V.view=_v; }catch(e){}
function side(){
  var baixo=SG.estoqueBaixo().length, abertos=D().vendas.filter(function(v){return !v.pago||!v.entregue;}).length;
  var u=null; try{u=localStorage.getItem('sg_usuario');}catch(e){}
  $('side').innerHTML='<div class="s-logo"><img class="esc" src="../img/logo-branco.png" alt="Surreal"><img class="cla" src="../img/logo-navy.png" alt="Surreal"></div>'
    + MENU.map(function(s){ return '<div class="s-sec">'+s[0]+'</div>'+s[1].map(function(m){
      var n = m[0]==='vendas'&&abertos?'<span class="n al">'+abertos+'</span>':m[0]==='estoque'&&baixo?'<span class="n al">'+baixo+'</span>':'';

function tabela(id, cols, linhas, tot){

  return '<table class="t" id="'+id+'"><thead><tr>'+cols.map(function(c,i){ return '<th class="'+(c.cls||'')+'" onclick="ordena(\''+id+'\','+i+')">'+c.t+(o&&o.i===i?'<span class="ar">'+(o.d>0?'▲':'▼')+'</span>':'')+'</th>'; }).join('')+'</tr></thead><tbody>'
    + linhas.map(function(l){ return '<tr>'+cols.map(function(c){ return '<td class="'+(c.cls||'')+'">'+c.f(l)+'</td>'; }).join('')+'</tr>'; }).join('')
    + (tot?'<tr class="tot">'+tot.map(function(t,i){return '<td class="'+(cols[i].cls||'')+'">'+t+'</td>';}).join('')+'</tr>':'')
    + '</tbody></table>';

  var rid=V.ficha||'chocolate', r=SG.receita(rid)||D().receitas[0]; rid=r.id;
  titulo('Fichas técnicas','Receitas com gramas por kg · custo com o preço da última compra de cada insumo','<button class="tool pri" onclick="novaReceita()">'+ic('mais')+'Nova receita</button>');
  var tipos={sabor:'Sabores',cobertura:'Coberturas e caldas',base:'Bases'};
  var lista='<div class="lista-r">'+Object.keys(tipos).map(function(t){ return '<div class="g">'+tipos[t]+'</div>'+D().receitas.filter(function(x){return x.tipo===t;}).map(function(x){ return '<button class="'+(x.id===rid?'on':'')+'" onclick="V.ficha=\''+x.id+'\';render()"><span>'+esc(x.nome)+'</span><span class="'+(x.itens.length?'mut':'amb')+'">'+(x.itens.length?SG.brl0(SG.custoReceitaKg(x.id)):'sem ficha')+'</span></button>'; }).join(''); }).join('')+'</div>';
  var comp=SG.composicao(rid), tot=comp.reduce(function(s,c){return s+c.custo;},0), peso=SG.pesoReceita(rid);
  var opIns=D().insumos.filter(function(i){return i.tipo==='ingrediente';}).slice().sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var opRec=D().receitas.filter(function(x){return x.id!==rid;});
  var ed='<div class="card"><div class="fl" style="margin-bottom:12px"><div class="f" style="flex:1"><label>Nome</label><input value="'+esc(r.nome)+'" onchange="SG.receita(\''+rid+'\').nome=this.value;SG.salvar()"></div>'
    + '<div class="f"><label>Tipo</label><select onchange="SG.receita(\''+rid+'\').tipo=this.value;SG.salvar()">'+Object.keys(tipos).map(function(t){return '<option value="'+t+'"'+(t===r.tipo?' selected':'')+'>'+tipos[t]+'</option>';}).join('')+'</select></div>'
    + '<div class="f"><label>Rende (kg)</label><input value="'+nv(r.rendKg,3)+'" style="width:90px" onchange="SG.receita(\''+rid+'\').rendKg=numIn(this.value)||1;SG.salvar()"></div>'
    + '<div class="f"><label>Custo por kg</label><div class="big" style="font-size:26px">'+SG.brl(SG.custoReceitaKg(rid))+'</div></div></div>'
    + (Math.abs(peso-(r.rendKg||1)*1000)>15&&r.itens.length?'<div class="av2" style="margin-bottom:10px">A soma dos ingredientes dá '+SG.num(peso,0)+' g para um rendimento de '+SG.num((r.rendKg||1)*1000,0)+' g. Se a receita perde peso (evaporação, cozimento), ajuste o "Rende".</div>':'')
    + '<div class="twrap"><table class="t"><thead><tr><th>Ingrediente</th><th class="num">g na receita</th><th class="num">R$/kg</th><th>Origem do preço</th><th class="num">Custo</th><th class="num">% do custo</th><th></th></tr></thead><tbody>'
    + r.itens.map(function(it,i){ var c=comp.filter(function(x){return x.item===it;})[0]||{};
        var orig=it.receita?'<span class="tag ac">sub-receita</span>':c.origem==='compra'?'<span class="tag vd">compra '+SG.dataCurta((SG.ultimaCompra(it.insumo)||{}).data)+'</span>':c.origem==='estimado'?'<span class="tag am">estimado</span>':'<span class="tag">manual</span>';
        return '<tr><td class="nm">'+esc(c.nome)+'</td><td class="num"><input value="'+nv(it.g,1)+'" onchange="SG.receita(\''+rid+'\').itens['+i+'].g=numIn(this.value)||0;SG.salvar()"></td><td class="num">'+SG.brl(c.custoKg)+'</td><td>'+orig+'</td><td class="num">'+SG.brl(c.custo)+'</td><td class="num">'+SG.pct(tot?c.custo/tot:0,0)+'</td><td><button class="del" title="Remover" onclick="SG.receita(\''+rid+'\').itens.splice('+i+',1);SG.salvar()">×</button></td></tr>'; }).join('')
    + '<tr class="tot"><td>Total</td><td class="num">'+SG.num(peso,0)+' g</td><td></td><td></td><td class="num">'+SG.brl(tot)+'</td><td class="num">100%</td><td></td></tr></tbody></table></div>'
    + '<div class="fl" style="margin-top:12px"><div class="f"><label>Adicionar ingrediente</label><select id="fAdd"><optgroup label="Insumos">'+opIns.map(function(i){return '<option value="i:'+i.id+'">'+esc(i.nome)+'</option>';}).join('')+'</optgroup><optgroup label="Sub-receitas">'+opRec.map(function(x){return '<option value="r:'+x.id+'">'+esc(x.nome)+'</option>';}).join('')+'</optgroup></select></div>'
    + '<div class="f"><label>Gramas</label><input id="fG" style="width:90px"></div><button class="tool pri" onclick="addIng(\''+rid+'\')">'+ic('mais')+'Adicionar</button>'
    + '<button class="tool" style="margin-left:auto" onclick="dupReceita(\''+rid+'\')">Duplicar</button><button class="tool" onclick="apagaReceita(\''+rid+'\')">Excluir</button></div>'
    + '<div class="f" style="margin-top:12px"><label>Observações</label><textarea rows="2" onchange="SG.receita(\''+rid+'\').obs=this.value;SG.salvar()">'+esc(r.obs||'')+'</textarea></div></div>';
  var usos=D().produtos.filter(function(p){return p.receita===rid||p.cobertura===rid;});
  if(usos.length) ed+='<div class="card"><div class="ct">Usada nos produtos</div><div class="cs">custo do pote P na venda direta</div>'+usos.map(function(p){var x=SG.precificar(p.id,'P','direto');return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--linha)"><span>'+esc(p.nome)+'</span><b>'+SG.brl(x.custo.total)+(x.tabela!=null?' · margem '+SG.pct(x.margem,0):'')+'</b></div>';}).join('')+'</div>';
  $('view').innerHTML='<div class="row" style="align-items:flex-start"><div class="card" style="flex:0 0 300px;padding:10px">'+lista+'</div><div style="flex:1;display:flex;flex-direction:column;gap:14px">'+ed+'</div></div>';
};
function addIng(rid){ var v=$('fAdd').value, g=numIn($('fG').value); if(!g){toast('Informe os gramas');return;} var it=v[0]==='i'?{insumo:v.slice(2),g:g}:{receita:v.slice(2),g:g}; SG.receita(rid).itens.push(it); SG.salvar(); }
function novaReceita(){ var n=prompt('Nome da nova receita:'); if(!n) return; var id=SG.novoId('r'); D().receitas.push({id:id,nome:n,tipo:'sabor',rendKg:1,itens:[],obs:''}); V.ficha=id; SG.salvar(); }
function dupReceita(rid){ var r=JSON.parse(JSON.stringify(SG.receita(rid))); r.id=SG.novoId('r'); r.nome+=' (cópia)'; D().receitas.push(r); V.ficha=r.id; SG.salvar(); }
function apagaReceita(rid){ var us=D().produtos.filter(function(p){return p.receita===rid||p.cobertura===rid;}); if(us.length){alert('Usada em: '+us.map(function(p){return p.nome;}).join(', ')+'. Troque a receita desses produtos antes.');return;} if(!confirm('Excluir esta receita?'))return; D().receitas=D().receitas.filter(function(r){return r.id!==rid;}); V.ficha=null; SG.salvar(); }

/* INSUMOS */
VIEWS.insumos=function(){
  var e=SG.estoque(), q=(V.qIns||'').toLowerCase();

  var ls=D().insumos.filter(function(i){return !q||i.nome.toLowerCase().indexOf(q)>=0||i.cat.toLowerCase().indexOf(q)>=0;});
  $('view').innerHTML='<div class="twrap alta">'+tabela('tIns',[
    {t:'Insumo',f:function(i){return '<input class="w" value="'+esc(i.nome)+'" onchange="SG.insumo(\''+i.id+'\').nome=this.value;SG.salvar()">';},s:function(i){return i.nome;},cls:'nm'},
    {t:'Categoria',f:function(i){return esc(i.cat);},s:function(i){return i.cat;}},
    {t:'Tipo',f:function(i){return i.tipo==='embalagem'?'<span class="tag ac">embalagem</span>':'ingrediente';},s:function(i){return i.tipo;}},
    {t:'Custo atual',f:function(i){var c=SG.custoInsumo(i.id);return '<b style="color:var(--txt)">'+SG.brl(c.valor)+'</b>/'+(i.un==='un'?'un':'kg');},v:function(i){return SG.custoInsumo(i.id).valor;},cls:'num'},
    {t:'Origem',f:function(i){var c=SG.custoInsumo(i.id);return c.origem==='compra'?'<span class="tag vd">compra '+SG.dataBR(c.data)+'</span>':c.origem==='estimado'?'<span class="tag am">estimado</span>':'<span class="tag">manual</span>';},s:function(i){return SG.custoInsumo(i.id).origem;}},
    {t:'Custo manual',f:function(i){return '<input value="'+nv(i.custoManual)+'" onchange="var x=SG.insumo(\''+i.id+'\');x.custoManual=numIn(this.value)||0;x.estimado=false;SG.salvar()">';},v:function(i){return i.custoManual;},cls:'num'},
    {t:'Estoque',f:function(i){var s=e.insumos[i.id];return s==null?'<span class="mut">não contado</span>':'<span class="'+(s<0||(i.min&&s<i.min)?'neg':'')+'">'+SG.qtdFmt(s,i.un)+'</span>';},v:function(i){return e.insumos[i.id]||0;},cls:'num'},
    {t:'Mínimo ('+'kg/un)',f:function(i){return '<input value="'+nv(i.min,3)+'" onchange="SG.insumo(\''+i.id+'\').min=numIn(this.value)||0;SG.salvar()">';},v:function(i){return i.min;},cls:'num'},
    {t:'Usado em',f:function(i){var n=D().receitas.filter(function(r){return r.itens.some(function(x){return x.insumo===i.id;});}).length;return n?n+' receitas':'<span class="mut">—</span>';},v:function(i){return D().receitas.filter(function(r){return r.itens.some(function(x){return x.insumo===i.id;});}).length;},cls:'num'},
  ],ls)+'</div>';
};
function novoInsumo(){ var n=prompt('Nome do insumo:'); if(!n) return; var emb=confirm('É embalagem (contado por unidade)?\nOK = embalagem · Cancelar = ingrediente (kg)'); D().insumos.push({id:SG.novoId('i'),nome:n,tipo:emb?'embalagem':'ingrediente',un:emb?'un':'kg',custoManual:0,cat:emb?'Potes':'Outros',min:0}); SG.salvar(); }

/* PRODUÇÃO */
VIEWS.producao=function(){
  titulo('Produção','Lotes produzidos · cada lote baixa os insumos da ficha e soma os potes no estoque', mesSel()+'<button class="tool pri" onclick="location.href=\'../#producao\'">Registrar pelo app</button>');
  var ls=D().producoes.filter(function(p){return !V.ym||p.data.slice(0,7)===V.ym;});
  var tk=0,tp=0,tc=0; ls.forEach(function(p){tk+=p.kg;tc+=SG.custoReceitaKg(p.receita)*p.kg;Object.keys(p.potes||{}).forEach(function(k){tp+=p.potes[k];});});
  $('view').innerHTML='<div class="kpis" style="grid-template-columns:repeat(4,1fr)">'+kpi('Lotes',ls.length,'')+kpi('Mistura produzida',SG.num(tk,1)+' kg','')+kpi('Potes envasados',tp,'')+kpi('Custo da mistura',SG.brl(tc),'a preço de hoje')+'</div>'
   +'<div class="twrap">'+tabela('tProd',[
    {t:'Data',f:function(p){return SG.dataBR(p.data);},s:function(p){return p.data;}},
    {t:'Receita',f:function(p){var r=SG.receita(p.receita);return esc(r?r.nome:p.receita);},s:function(p){return p.receita;},cls:'nm'},
    {t:'Kg',f:function(p){return SG.num(p.kg,2);},v:function(p){return p.kg;},cls:'num'},
    {t:'Potes',f:function(p){return Object.keys(p.potes||{}).map(function(k){return p.potes[k]+' '+k;}).join(' + ')||'—';},v:function(p){return Object.values(p.potes||{}).reduce(function(s,x){return s+x;},0);},cls:'num'},
    {t:'Custo hoje',f:function(p){return SG.brl(SG.custoReceitaKg(p.receita)*p.kg);},v:function(p){return SG.custoReceitaKg(p.receita)*p.kg;},cls:'num'},
    {t:'Origem',f:function(p){return p.historico?'<span class="tag">planilha</span>':'<span class="tag ac">app</span>';}},
    {t:'',f:function(p){return '<button class="del" onclick="apaga(\'producoes\',\''+p.id+'\')">×</button>';}},
  ],ls.slice().sort(function(a,b){return a.data<b.data?1:-1;}))+'</div>';
};
function apaga(col,id){ if(!confirm('Excluir este lançamento?')) return; D()[col]=D()[col].filter(function(x){return x.id!==id;}); SG.salvar(); toast('Excluído'); }

/* ESTOQUE */

  var h='';
  if(!e.iniciado) h+='<div class="av2">O histórico importado da planilha não diz quanto há hoje no freezer e no armário. Faça uma contagem uma vez pelo app (aba Estoque) e o saldo passa a andar sozinho.</div>';
  h+='<div class="grid2"><div class="card"><div class="ct">Potes prontos</div><div class="cs">por sabor e tamanho</div><div class="twrap"><table class="t"><thead><tr><th>Sabor</th>'+ts.map(function(t){return '<th class="num">'+t.nome+' '+t.ml+'</th>';}).join('')+'<th class="num">Total</th></tr></thead><tbody>'
    + SG.produtosAtivos().map(function(p){ var tt=0; return '<tr><td class="nm">'+esc(p.nome)+'</td>'+ts.map(function(t){var q=e.potes[p.id+'|'+t.id];tt+=q||0;return '<td class="num '+(q<0?'neg':q?'':'mut')+'">'+(q==null?'—':q)+'</td>';}).join('')+'<td class="num"><b>'+tt+'</b></td></tr>'; }).join('')+'</tbody></table></div></div>';
  var ins=D().insumos.filter(function(i){return e.insumos[i.id]!=null||i.min;});
  h+='<div class="card"><div class="ct">Insumos</div><div class="cs">abaixo do mínimo em vermelho</div><div class="twrap">'+tabela('tEst',[
    {t:'Insumo',f:function(i){return esc(i.nome);},s:function(i){return i.nome;},cls:'nm'},
    {t:'Saldo',f:function(i){var s=e.insumos[i.id];return '<span class="'+(s<0||(i.min&&s<i.min)?'neg':'')+'">'+SG.qtdFmt(s,i.un)+'</span>';},v:function(i){return e.insumos[i.id]||0;},cls:'num'},
    {t:'Mínimo',f:function(i){return i.min?SG.qtdFmt(i.min,i.un):'—';},v:function(i){return i.min;},cls:'num'},
    {t:'Valor em estoque',f:function(i){var s=e.insumos[i.id]||0;return SG.brl(Math.max(0,s)*SG.custoInsumo(i.id).valor);},v:function(i){return Math.max(0,e.insumos[i.id]||0)*SG.custoInsumo(i.id).valor;},cls:'num'},
    {t:'Contado em',f:function(i){return e.contado.ins[i.id]?SG.dataBR(e.contado.ins[i.id]):'—';}},
  ],ins)+(ins.length?'':'<div class="nota" style="padding:14px">Nenhum insumo contado.</div>')+'</div></div></div>';
  $('view').innerHTML=h;
};

/* PEDIDOS */
VIEWS.vendas=function(){
  var f=V.fv||'todos', can=V.fc||'';
  titulo('Pedidos','Clique em Pago/Entregue para mudar · lucro com o custo de hoje dos potes', mesSel()
    +'<select class="tool" onchange="V.fc=this.value;render()"><option value="">Todos os canais</option>'+D().canais.map(function(c){return '<option value="'+c.id+'"'+(c.id===can?' selected':'')+'>'+esc(c.nome)+'</option>';}).join('')+'</select>'
    +'<select class="tool" onchange="V.fv=this.value;render()">'+[['todos','Todas as situações'],['abertos','Em aberto'],['receber','A receber'],['entregar','A entregar']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===f?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
    +'<button class="tool" onclick="csvVendas()">'+ic('baixar')+'CSV</button>');
  var ls=D().vendas.filter(function(v){ return (!V.ym||v.data.slice(0,7)===V.ym)&&(!can||v.canal===can)&&(f==='todos'||(f==='abertos'&&(!v.pago||!v.entregue))||(f==='receber'&&!v.pago)||(f==='entregar'&&!v.entregue)); });
  var rs=ls.map(function(v){return {v:v,r:SG.resultadoVenda(v)};});
  var T=rs.reduce(function(a,x){a.f+=x.r.receita;a.c+=x.r.custo;a.t+=x.r.taxa;a.l+=x.r.lucro;a.p+=SG.potesVenda(x.v);return a;},{f:0,c:0,t:0,l:0,p:0});
  $('view').innerHTML='<div class="twrap alta">'+tabela('tVen',[
    {t:'Data',f:function(x){return SG.dataBR(x.v.data);},s:function(x){return x.v.data;}},
    {t:'Cliente',f:function(x){return esc(SG.nomeCliente(x.v));},s:function(x){return SG.nomeCliente(x.v);},cls:'nm'},
    {t:'Canal',f:function(x){return esc(nCanal(x.v.canal));},s:function(x){return x.v.canal;}},
    {t:'Itens',f:function(x){return '<span style="white-space:normal;display:block;max-width:360px">'+x.v.itens.map(function(i){return i.qtd+'× '+esc(SG.nomeItem(i).replace(/ com .*/,''))+(i.tam?' '+i.tam:'')+' <span class="mut">'+SG.brl(i.preco)+'</span>';}).join('<br>')+'</span>';}},
    {t:'Potes',f:function(x){return SG.potesVenda(x.v);},v:function(x){return SG.potesVenda(x.v);},cls:'num'},
    {t:'Total',f:function(x){return '<b style="color:var(--txt)">'+SG.brl(x.r.receita)+'</b>';},v:function(x){return x.r.receita;},cls:'num'},
    {t:'Custo',f:function(x){return SG.brl(x.r.custo)+(x.r.completo?'':' <span class="tag am" title="Item sem ficha técnica">?</span>');},v:function(x){return x.r.custo;},cls:'num'},
    {t:'Lucro',f:function(x){return '<span class="'+(x.r.lucro>=0?'pos':'neg')+'">'+SG.brl(x.r.lucro)+'</span>';},v:function(x){return x.r.lucro;},cls:'num'},
    {t:'Margem',f:function(x){return x.r.receita?SG.pct(x.r.lucro/x.r.receita,0):'—';},v:function(x){return x.r.receita?x.r.lucro/x.r.receita:0;},cls:'num'},
    {t:'Pago',f:function(x){return '<span class="chk tag '+(x.v.pago?'vd':'vm')+'" onclick="vMarca(\''+x.v.id+'\',\'pago\')">'+(x.v.pago?'pago':'a receber')+'</span>';},s:function(x){return x.v.pago?'1':'0';},cls:'c'},
    {t:'Entregue',f:function(x){return '<span class="chk tag '+(x.v.entregue?'vd':'am')+'" onclick="vMarca(\''+x.v.id+'\',\'entregue\')">'+(x.v.entregue?'entregue':'a entregar')+'</span>';},s:function(x){return x.v.entregue?'1':'0';},cls:'c'},
    {t:'',f:function(x){return '<button class="del" onclick="apaga(\'vendas\',\''+x.v.id+'\')">×</button>';}},
  ],rs.sort(function(a,b){return a.v.data<b.v.data?1:-1;}),['Total',ls.length+' pedidos','','',T.p,SG.brl(T.f),SG.brl(T.c),SG.brl(T.l),SG.pct(T.f?T.l/T.f:0,0),'','',''])+'</div>';
};
function vMarca(id,c){ var v=D().vendas.filter(function(x){return x.id===id;})[0]; v[c]=!v[c]; if(c==='entregue'&&v.entregue) v.dataEntrega=SG.hoje(); SG.salvar(); }
function csvVendas(){
  var l=[['data','cliente','canal','produto','tamanho','qtd','preco_unit','total','pago','entregue']];
  D().vendas.forEach(function(v){ v.itens.forEach(function(i){ l.push([v.data,SG.nomeCliente(v),nCanal(v.canal),SG.nomeItem(i),i.tam||'',i.qtd,String(i.preco).replace('.',','),String(i.qtd*i.preco).replace('.',','),v.pago?'sim':'não',v.entregue?'sim':'não']); }); });
  var csv='﻿'+l.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='surreal-pedidos-'+SG.hoje()+'.csv'; a.click();
}

/* CLIENTES */
VIEWS.clientes=function(){
  titulo('Clientes','Ranking por faturamento total · tipo e telefone editáveis');
  var agg={}; D().vendas.forEach(function(v){ if(!v.cliente) return; var a=agg[v.cliente]=agg[v.cliente]||{n:0,t:0,p:0,u:null,pri:null}; a.n++; a.t+=SG.totalVenda(v); a.p+=SG.potesVenda(v); if(!a.u||v.data>a.u)a.u=v.data; if(!a.pri||v.data<a.pri)a.pri=v.data; });
  var hj=SG.hoje();
  function dias(d){ return d?Math.round((new Date(hj)-new Date(d))/864e5):null; }
  $('view').innerHTML='<div class="twrap alta">'+tabela('tCli',[
    {t:'Cliente',f:function(c){return '<input class="w" value="'+esc(c.nome)+'" onchange="SG.cliente(\''+c.id+'\').nome=this.value;SG.salvar()">';},s:function(c){return c.nome;},cls:'nm'},
    {t:'Tipo',f:function(c){return '<select onchange="SG.cliente(\''+c.id+'\').tipo=this.value;SG.salvar()"><option value="consumidor"'+(c.tipo!=='revenda'?' selected':'')+'>Consumidor</option><option value="revenda"'+(c.tipo==='revenda'?' selected':'')+'>Revenda</option></select>';},s:function(c){return c.tipo;}},

/* FINANCEIRO */
VIEWS.financeiro=function(){
  titulo('Resultado e caixa','Resultado = vendas − custo dos potes − taxas · Caixa = o que entrou − o que saiu');
  var ms=SG.mesesComDados(), rs=ms.map(function(m){return {m:m,r:SG.resumo(m),c:SG.caixa(m)};});
  var ind=SG.indiretosMes();
  var lin=[
    ['Faturamento',function(x){return x.r.faturamento;},1],
    ['(−) Taxas de canal',function(x){return -x.r.taxa;}],
    ['(−) Custo dos potes vendidos',function(x){return -x.r.custo;}],
    ['= Lucro bruto',function(x){return x.r.lucro;},1],
    ['Margem bruta',function(x){return x.r.faturamento?x.r.lucro/x.r.faturamento:null;},0,1],
    ['',null],
    ['Entradas de caixa (pedidos pagos)',function(x){return x.c.entradas;}],
    ['(−) Compras de insumos',function(x){return -x.c.compras;}],
    ['(−) Despesas',function(x){return -x.c.despesas;}],
    ['= Saldo de caixa do mês',function(x){return x.c.saldo;},1],
  ];
  var acum=0, sac=rs.map(function(x){acum+=x.c.saldo;return acum;});
  var h='<div class="card"><div class="ct">Resultado por mês</div><div class="cs">Custo dos potes = ficha técnica a preço de hoje + embalagem'+(ind?' + indiretos rateados ('+SG.brl(ind)+'/mês)':'')+'. A diferença entre lucro bruto e caixa é estoque comprado e ainda não vendido.</div><div class="twrap"><table class="t"><thead><tr><th>Linha</th>'+rs.map(function(x){return '<th class="num">'+SG.nomeMes(x.m,true)+'</th>';}).join('')+'<th class="num">Total</th></tr></thead><tbody>'
    + lin.map(function(l){ if(!l[1]) return '<tr><td colspan="'+(rs.length+2)+'" style="padding:4px"></td></tr>';
        var vs=rs.map(l[1]), t=l[3]?null:vs.reduce(function(s,v){return s+(v||0);},0);
        if(l[3]){ var F=rs.reduce(function(s,x){return s+x.r.faturamento;},0),L=rs.reduce(function(s,x){return s+x.r.lucro;},0); t=F?L/F:null; }
        var fm=function(v){ return v==null?'—':l[3]?SG.pct(v,0):'<span class="'+(v<0?'neg':'')+'">'+SG.brl(v)+'</span>'; };
        return '<tr'+(l[2]?' class="tot"':'')+'><td class="nm">'+l[0]+'</td>'+vs.map(function(v){return '<td class="num">'+fm(v)+'</td>';}).join('')+'<td class="num">'+fm(t)+'</td></tr>'; }).join('')
    + '<tr><td class="nm">Saldo acumulado</td>'+sac.map(function(v){return '<td class="num"><b class="'+(v>=0?'pos':'neg')+'">'+SG.brl(v)+'</b></td>';}).join('')+'<td></td></tr>'
    + '</tbody></table></div></div>';
  h+='<div class="grid2"><div class="card"><div class="ct">Entradas × saídas</div><div class="cs">por mês</div><div class="gbox"><canvas id="gCx"></canvas></div></div>';
  var cats=SG.caixa(null).categorias, ck=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];}), mx=cats[ck[0]]||1;
  h+='<div class="card"><div class="ct">Para onde foi o dinheiro</div><div class="cs">todas as saídas do período</div><div class="bars">'+ck.map(function(k){return '<div class="r"><span>'+esc(k)+'</span><div class="bb"><i style="width:'+cats[k]/mx*100+'%"></i></div><b>'+SG.brl0(cats[k])+'</b></div>';}).join('')+'</div>'
    + '<div class="nota" style="margin-top:12px">'+(D().alertasImport||[]).map(function(a){return '• '+esc(a);}).join('<br>')+'</div></div></div>';
  $('view').innerHTML=h;
  grafico('gCx',{type:'bar',data:{labels:rs.map(function(x){return SG.nomeMes(x.m,true);}),datasets:[{label:'Entradas',data:rs.map(function(x){return x.c.entradas;}),backgroundColor:cor('--verde'),borderRadius:6},{label:'Saídas',data:rs.map(function(x){return x.c.saidas;}),backgroundColor:cor('--vermelho'),borderRadius:6}]},options:Object.assign(opBar(SG.brl),{plugins:{legend:{display:true,labels:{boxWidth:10,font:{size:10,weight:700}}}}})});
};

/* COMPRAS E DESPESAS */

  var ins=D().insumos.slice().sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var cs=D().compras.filter(function(c){return !V.ym||c.data.slice(0,7)===V.ym;}), ds=D().despesas.filter(function(d){return !V.ym||d.data.slice(0,7)===V.ym;});
  var h='<div class="card"><div class="ct">Nova compra</div><div class="fl" style="margin-top:10px"><div class="f"><label>Data</label><input type="date" id="nData" value="'+SG.hoje()+'"></div>'
    + '<div class="f" style="flex:1"><label>Insumo</label><select id="nIns">'+ins.map(function(i){return '<option value="'+i.id+'">'+esc(i.nome)+' ('+(i.un==='un'?'un':'kg')+')</option>';}).join('')+'</select></div>'
    + '<div class="f"><label>Quantidade (kg ou un)</label><input id="nQ" style="width:120px"></div><div class="f"><label>Valor pago (R$)</label><input id="nV" style="width:120px"></div>'
    + '<button class="tool pri" onclick="addCompra()">'+ic('mais')+'Lançar compra</button></div></div>';
  h+='<div class="twrap">'+tabela('tCom',[
    {t:'Data',f:function(c){return SG.dataBR(c.data);},s:function(c){return c.data;}},
    {t:'Insumo',f:function(c){var i=SG.insumo(c.insumo);return esc(i?i.nome:c.desc);},s:function(c){return c.insumo;},cls:'nm'},
    {t:'Quantidade',f:function(c){var i=SG.insumo(c.insumo);return SG.qtdFmt(c.qtd,i&&i.un);},v:function(c){return c.qtd;},cls:'num'},
    {t:'Valor pago',f:function(c){return SG.brl(c.valor);},v:function(c){return c.valor;},cls:'num'},
    {t:'R$/kg ou un',f:function(c){return SG.brl(c.valor/c.qtd);},v:function(c){return c.valor/c.qtd;},cls:'num'},
    {t:'Origem',f:function(c){return c.historico?'<span class="tag">planilha</span>':'<span class="tag ac">app</span>';}},
    {t:'',f:function(c){return '<button class="del" onclick="apaga(\'compras\',\''+c.id+'\')">×</button>';}},
  ],cs.slice().sort(function(a,b){return a.data<b.data?1:-1;}),['Total',cs.length+' compras','',SG.brl(cs.reduce(function(s,c){return s+c.valor;},0)),'','',''])+'</div>';
  h+='<div class="card"><div class="ct">Despesas</div><div class="cs">Gastos que não são insumo</div><div class="fl"><div class="f"><label>Data</label><input type="date" id="dData" value="'+SG.hoje()+'"></div>'
    + '<div class="f"><label>Categoria</label><select id="dCat">'+['Aluguel','Energia','Água','Gás','Marketing','Embalagens','Equipamentos','Taxas','Outros'].map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>'
    + '<div class="f" style="flex:1"><label>Descrição</label><input id="dDesc"></div><div class="f"><label>Valor (R$)</label><input id="dV" style="width:120px"></div><button class="tool pri" onclick="addDespesa()">'+ic('mais')+'Lançar despesa</button></div>'
    + '<div class="twrap" style="margin-top:12px">'+tabela('tDes',[
    {t:'Data',f:function(d){return SG.dataBR(d.data);},s:function(d){return d.data;}},
    {t:'Categoria',f:function(d){return esc(d.categoria);},s:function(d){return d.categoria;}},
    {t:'Descrição',f:function(d){return esc(d.desc);},s:function(d){return d.desc;},cls:'nm'},
    {t:'Valor',f:function(d){return SG.brl(d.valor);},v:function(d){return d.valor;},cls:'num'},
    {t:'',f:function(d){return '<button class="del" onclick="apaga(\'despesas\',\''+d.id+'\')">×</button>';}},
  ],ds)+'</div></div>';
  $('view').innerHTML=h;
};
function addCompra(){ var q=numIn($('nQ').value), v=numIn($('nV').value); if(!q||!v){toast('Preencha quantidade e valor');return;} var i=SG.insumo($('nIns').value), ant=SG.custoInsumo(i.id).valor;
  D().compras.push({id:SG.novoId('c'),data:$('nData').value||SG.hoje(),insumo:i.id,qtd:q,valor:v,ts:Date.now(),historico:false}); SG.salvar(); var d=ant?(v/q)/ant-1:0; toast(i.nome+': '+SG.brl(v/q)+(ant?' ('+(d>=0?'+':'')+SG.pct(d,0)+')':'')); }
function addDespesa(){ var v=numIn($('dV').value); if(!v){toast('Informe o valor');return;} D().despesas.push({id:SG.novoId('d'),data:$('dData').value||SG.hoje(),categoria:$('dCat').value,desc:$('dDesc').value||$('dCat').value,valor:v,ts:Date.now()}); SG.salvar(); toast('Despesa lançada'); }

    {t:'Cobertura',f:function(p){return '<select onchange="SG.produto(\''+p.id+'\').cobertura=this.value||null;SG.salvar()"><option value="">— nenhuma —</option>'+D().receitas.filter(function(r){return r.tipo==='cobertura';}).map(function(r){return '<option value="'+r.id+'"'+(r.id===p.cobertura?' selected':'')+'>'+esc(r.nome)+'</option>';}).join('')+'</select>';}},
    {t:'% cobertura',f:function(p){return p.cobertura?'<input value="'+nv((p.pctCob||0)*100,0)+'" onchange="SG.produto(\''+p.id+'\').pctCob=(numIn(this.value)||0)/100;SG.salvar()">':'—';},cls:'num'},

function novoProduto(){ var n=prompt('Nome do produto (ex.: Pistache com Calda de Chocolate):'); if(!n) return; D().produtos.push({id:SG.novoId('pr'),nome:n,receita:null,cobertura:null,pctCob:0.1,ativo:true}); SG.salvar(); }
function backup(){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(D(),null,1)],{type:'application/json'})); a.download='surreal-backup-'+SG.hoje()+'.json'; a.click(); }
function restaura(f){ if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d.versao||!d.receitas) throw 0; if(!confirm('Substituir os dados atuais pelo backup?')) return; if(SGR.ativo){ SG.usar(d); SG.salvar(); toast('Backup restaurado e enviado'); } else { localStorage.setItem('sg_dados',JSON.stringify(d)); location.reload(); } }catch(e){ alert('Arquivo inválido'); } }; r.readAsText(f); }


function baixarApp(){

  d.onclick=function(e){ if(e.target===d) d.remove(); };
  var url='https://surreal.onespot.com.br/', qr='';

  d.innerHTML='<div class="card" style="width:380px;max-width:92vw;text-align:center;padding:24px;background:var(--pop)"><div class="ct" style="font-size:16px">Baixar o app no celular</div><div class="cs" style="margin:6px 0 14px">Aponte a câmera do celular para o código</div>'
    + '<div style="width:220px;margin:0 auto 14px;background:#fff;border-radius:12px;padding:10px">'+qr+'</div>'
    + '<div class="nota" style="text-align:left;line-height:1.7"><b>Android (Chrome):</b> abra o link → ⋮ → <b>Instalar app</b>.<br><b>iPhone (Safari):</b> abra o link → Compartilhar → <b>Adicionar à Tela de Início</b>.<br>Ou digite: <b>surreal.onespot.com.br</b></div>'
    + '<button class="tool pri" style="margin-top:16px;width:100%;justify-content:center" onclick="document.getElementById(\'qrBox\').remove()">Fechar</button></div>';
  document.body.appendChild(d);

function mostraLogin(msg){ $('login').classList.add('on'); $('lgForm').style.display=''; $('lgCarr').style.display='none'; $('lgErro').textContent=msg||''; $('btEntrar').disabled=false; $('btEntrar').textContent='Entrar'; }
function entrar(){ var e=$('lgEmail').value, s=$('lgSenha').value; if(!e||!s){ $('lgErro').textContent='Preencha e-mail e senha.'; return; }
  $('btEntrar').disabled=true; $('btEntrar').textContent='Entrando…'; $('lgErro').textContent='';
  SGR.entrar(e,s,CB).catch(function(x){ $('btEntrar').disabled=false; $('btEntrar').textContent='Entrar'; if(x.message) $('lgErro').textContent=x.message; }); }
function trocaSenha(){ var n=prompt('Nova senha (mínimo 6 caracteres):'); if(!n) return; if(n.length<6){ alert('A senha precisa ter pelo menos 6 caracteres.'); return; } SGR.trocarSenha(n).then(function(){ toast('Senha trocada'); }).catch(function(e){ alert('Não deu: '+e.message); }); }
var CB={ login:mostraLogin, pronto:function(){ $('login').classList.remove('on'); render(); },
  status:function(s){ var d=$('sdot'); if(d) d.className='sdot'+(s==='sync'?' s':s==='off'?' off':''); } };
aplicaTema();
if(!SGR.ativo) render(); else { $('login').classList.add('on'); $('lgForm').style.display='none'; $('lgCarr').style.display=''; SGR.iniciar(CB); }
